name: Windows executable

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows executable
    runs-on: windows-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Install stable Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup override set stable

      - name: Run tests
        run: cargo test --locked

      - name: Verify release tag matches Cargo version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 |
            ConvertFrom-Json
          $version = $metadata.packages[0].version
          $expectedTag = "v$version"
          if ("${{ github.ref_name }}" -ne $expectedTag) {
            throw "Release tag must be $expectedTag to match Cargo.toml"
          }

      - name: Build release executable
        run: cargo build --release --locked --features bundle

      - name: Prepare published files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/dioxus_windows_form.exe dist/Cyclotrone-calculator.exe
          $hash = (Get-FileHash dist/Cyclotrone-calculator.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Cyclotrone-calculator.exe" |
            Set-Content -Encoding ascii dist/Cyclotrone-calculator.exe.sha256

      - name: Upload executable from every build
        uses: actions/upload-artifact@v4
        with:
          name: Cyclotrone-calculator-Windows
          path: |
            dist/Cyclotrone-calculator.exe
            dist/Cyclotrone-calculator.exe.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $files = @(
            "dist/Cyclotrone-calculator.exe",
            "dist/Cyclotrone-calculator.exe.sha256"
          )

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $files --clobber
          } else {
            gh release create $tag $files `
              --verify-tag `
              --generate-notes `
              --title "Cyclotrone Calculator $tag"
          }
